name: compatibility-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "workspace.yaml"
      - "src/quantik_workspace/compatibility.py"
      - "schemas/compatibility-report.schema.json"

jobs:
  plan-and-contract-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: quantik-workspace
      - uses: actions/checkout@v4
        with:
          repository: mberlanda/quantik-core-contracts
          path: quantik-core-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: quantik-workspace
        run: python -m pip install -e .
      - working-directory: quantik-workspace
        run: quantik-workspace validate fixtures
      - working-directory: quantik-workspace
        run: quantik-workspace compatibility smoke --output compatibility-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-plan
          path: quantik-workspace/compatibility-report.json
