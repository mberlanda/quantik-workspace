name: validate-workspace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: quantik-workspace validate workspace
      - run: quantik-workspace task validate
      - run: quantik-workspace validate releases
      - run: quantik-workspace validate locks
      - run: quantik-workspace validate generated
      - run: quantik-workspace validate docs
      - run: python -m compileall -q src tests
