name: Release train
description: Track producer publication and consumer adoption.
title: "[QREL] "
body:
  - type: input
    id: release
    attributes: {label: Release ID}
    validations: {required: true}
  - type: textarea
    id: producer
    attributes: {label: Producer version, branch, commit, tag, and version sources}
    validations: {required: true}
  - type: textarea
    id: consumers
    attributes: {label: Required consumers and release ordering}
  - type: textarea
    id: checks
    attributes: {label: Candidate, published, compatibility, and lock checks}
