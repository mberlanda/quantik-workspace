    "The 55 rows are folded in through data/merge_corpus.py to a NEW file with a new hash, never an in-place rewrite of an existing corpus.",
    "No strength claim is made from 55 rows; whether shallow labels change play is settled in the QW-024 arena, and the initiative says so."
