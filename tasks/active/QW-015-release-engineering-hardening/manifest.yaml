  "acceptance_criteria": [
    "contract_version is excluded from the Rust-vs-Python equality in validate_opening_book_summary.py and kept for the --expected-release assertion, with a test that a version-skewed pair of otherwise identical summaries passes the equality and fails --expected-release.",
    "expected-release is dropped from both PR-time jobs AND its default: \"1.2.0\" is removed from actions/opening-book-consistency/action.yml:23 — omitting the input must not silently reintroduce the literal.",
    "A release preflight asserts the tag does not already exist, VERSION matches the tag, and every downstream-referenced action path resolves at that ref.",
    "Each repository derives its version from one literal; a grep for a hardcoded release string outside that source returns nothing.",
    "The deadlock is demonstrated to be gone: a PR that changes only Python, with contracts still on the previous release, goes green without a coordinated tag."
