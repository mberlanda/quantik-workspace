  "release_order": ["quantik-core-contracts", "quantik-core-py", "quantik-core-rust", "quantik-models-py"],
  "acceptance_criteria": [
    "Normative JSONL fixtures cover state, current player, legal actions, ordering, action indices, symmetries, canonicalization, masks, and value perspective.",
    "Arrow/Parquet logical and physical schemas carry explicit release and generator metadata.",
