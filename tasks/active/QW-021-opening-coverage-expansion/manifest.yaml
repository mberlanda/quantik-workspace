  "problem": "The flagship network trained on zero positions below ply 6, including plies 4 and 5 where the contest lives. This now has a measured payoff rather than a plausible one: adding 109,602 exactly-solved positions at plies 3-6 (the v1 to v2 corpus step) bought about five points of ply-4 probe accuracy and cut value MAE threefold, and took cpool from a 48.9% tie with minimax-d2 to 59.7% from a ply-3 start, improving in BOTH seats. Training the smaller corpus to convergence does not recover it — see ADR 0014. Plies 0-6 hold 1,019,275 canonical live positions, fewer than the 3,087,356 rows already trained on, and the enumerations are already on disk as runs/canonical/level01.npy through level08.npy. Only oracle labelling is missing. The catch is that plies 4-6 ARE the held-out probe.",
