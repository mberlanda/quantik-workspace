    "Both schemas are registered in quantik-core-contracts with golden fixtures, and the naming is settled — every registered contract is observation.v1, qfen.v1 with no quantik. prefix, so either the prefix goes or the convention is amended in writing.",
    "The format decision is recorded: OpenAPI 3.1 (JSON Schema 2020-12 compatible, enabling client generation) versus a plain JSON Schema pair.",
