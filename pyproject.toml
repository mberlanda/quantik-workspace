[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantik-workspace"
version = "0.1.0"
description = "File-based orchestration control plane for the Quantik repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Mauro Berlanda"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[project.scripts]
quantik-workspace = "quantik_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["quantik_workspace"]
